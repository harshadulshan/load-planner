<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Six steps: load list, blocks, free spaces with full floors, look-ahead search, checks, and the 3D guide, PDF and Excel for the loaders" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a plan is made</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}.fu{animation:fu .8s ease-out both}@keyframes fu{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="9.0s" begin="0s;t.end"/></rect><text x="28" y="40" font-size="18" font-weight="700" fill="#e6edf3">How a plan is made</text><g class="fu" style="animation-delay:0.15s"><rect x="17.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="90.0" y="104" font-size="22" text-anchor="middle">📋</text><text x="90.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Your load list</text><text x="90.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">sizes, counts, weights,</text><text x="90.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">this side up, stops</text></g><path d="M165.0 130.0 l14 0" stroke="#21262d" stroke-width="2"/><circle cx="165.0" cy="130.0" r="3.5" fill="#3987e5" opacity="0"><animate attributeName="cx" values="165.0;179.0" dur="1s" begin="1.00s;t.begin+1.00s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="1.00s;t.begin+1.00s"/></circle><g class="fu" style="animation-delay:0.50s"><rect x="181.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="254.0" y="104" font-size="22" text-anchor="middle">🧱</text><text x="254.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Blocks</text><text x="254.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">stacks, rows, layers</text><text x="254.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">of one kind of box</text></g><path d="M329.0 130.0 l14 0" stroke="#21262d" stroke-width="2"/><circle cx="329.0" cy="130.0" r="3.5" fill="#3987e5" opacity="0"><animate attributeName="cx" values="329.0;343.0" dur="1s" begin="1.35s;t.begin+1.35s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="1.35s;t.begin+1.35s"/></circle><g class="fu" style="animation-delay:0.85s"><rect x="345.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="418.0" y="104" font-size="22" text-anchor="middle">📐</text><text x="418.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Free spaces</text><text x="418.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">largest empty boxes,</text><text x="418.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">each with a full floor</text></g><path d="M493.0 130.0 l14 0" stroke="#21262d" stroke-width="2"/><circle cx="493.0" cy="130.0" r="3.5" fill="#3987e5" opacity="0"><animate attributeName="cx" values="493.0;507.0" dur="1s" begin="1.70s;t.begin+1.70s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="1.70s;t.begin+1.70s"/></circle><g class="fu" style="animation-delay:1.20s"><rect x="509.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="582.0" y="104" font-size="22" text-anchor="middle">🔭</text><text x="582.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Look ahead</text><text x="582.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">try several blocks,</text><text x="582.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">keep the best finish</text></g><path d="M657.0 130.0 l14 0" stroke="#21262d" stroke-width="2"/><circle cx="657.0" cy="130.0" r="3.5" fill="#3987e5" opacity="0"><animate attributeName="cx" values="657.0;671.0" dur="1s" begin="2.05s;t.begin+2.05s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="2.05s;t.begin+2.05s"/></circle><g class="fu" style="animation-delay:1.55s"><rect x="673.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="746.0" y="104" font-size="22" text-anchor="middle">✅</text><text x="746.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Checked</text><text x="746.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">support, overlap,</text><text x="746.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">weight, payload, stops</text></g><path d="M821.0 130.0 l14 0" stroke="#21262d" stroke-width="2"/><circle cx="821.0" cy="130.0" r="3.5" fill="#3987e5" opacity="0"><animate attributeName="cx" values="821.0;835.0" dur="1s" begin="2.40s;t.begin+2.40s" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" dur="1s" begin="2.40s;t.begin+2.40s"/></circle><g class="fu" style="animation-delay:1.90s"><rect x="837.0" y="70" width="146" height="120" rx="12" fill="#161b22" stroke="#30363d"/><text x="910.0" y="104" font-size="22" text-anchor="middle">🚚</text><text x="910.0" y="132" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">For the loaders</text><text x="910.0" y="154" font-size="12" fill="#8b949e" text-anchor="middle">3D steps, PDF sheet,</text><text x="910.0" y="170" font-size="12" fill="#8b949e" text-anchor="middle">Excel manifest</text></g><text x="500.0" y="230" font-size="13" fill="#8b949e" text-anchor="middle">Several stops: the last stop is packed first, and nothing for an earlier stop may go behind it.</text>
</svg>
